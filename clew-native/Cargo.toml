[workspace]
resolver = "2"
members = [
    "sandbox",
    "circuit_breaker",
    "interjection",
    "compaction",
    "actor",
    "pyo3",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Clew Contributors"]
repository = "https://github.com/zai-shop/clew"
description = "Native Rust extension modules for Clew v2 — actor runtime, sandbox, compaction, circuit breaker, interjection buffer"
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.20"
ahash = "0.8"
smallvec = { version = "1.13", features = ["serde"] }
bytes = "1.7"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311", "generate-import-lib"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
