[package]
name = "clew-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OS-level process sandbox for Clew — Landlock (Linux) and Seatbelt (macOS)"

[dependencies]
thiserror.workspace = true
tracing.workspace = true
once_cell.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# Seatbelt is invoked via libc sandbox_* functions; bind directly.
libc = "0.2"

[target.'cfg(not(any(target_os = "linux", target_os = "macos")))'.dependencies]

[lib]
name = "clew_sandbox"
path = "src/lib.rs"
