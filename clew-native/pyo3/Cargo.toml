[package]
name = "clew-native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for Clew v2 — exposes Rust subsystems (sandbox, circuit_breaker, interjection, compaction, actor) to Python."

[lib]
name = "clew_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pyo3.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
once_cell.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "rt"] }
clew-sandbox = { path = "../sandbox" }
clew-circuit-breaker = { path = "../circuit_breaker" }
clew-interjection = { path = "../interjection" }
clew-compaction = { path = "../compaction" }
clew-actor = { path = "../actor" }
