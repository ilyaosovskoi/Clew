name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Qt system libraries required by PySide6 / pytest-qt so that QtGui
      # imports succeed under the offscreen QPA platform on a headless runner.
      - name: Install Qt system libraries
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # NOTE: requirements.txt is installed first because pyproject.toml's
      # [project.dependencies] is currently missing several runtime deps
      # (textual, anthropic, openai, groq, ...). Installing both keeps the
      # suite green. This pyproject/requirements mismatch should be fixed
      # separately (out of scope for this PR).
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev]'

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        # --timeout=60 so any future hang fails fast instead of stalling CI.
        run: pytest clew/ --timeout=60 -q

  lint:
    name: Lint (black)
    runs-on: ubuntu-latest
    # Advisory only: the codebase has pre-existing black violations, so this
    # job is allowed to fail without blocking the workflow. Once the codebase
    # is black-clean, remove continue-on-error to make lint gating.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install black
        run: |
          pip install --upgrade pip
          pip install "black>=24.0"

      - name: black --check
        run: black --check clew/
